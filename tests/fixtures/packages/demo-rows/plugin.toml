# A package that contributes one interface module and nothing else.
#
# `[[ui]]` is the section the engine ignores and Nest reads. Everything about
# installing this — the format, the checksum, the unpack, the disclosure — is
# the engine's; Nest only carries the file across and serves one directory.
[plugin]
name = "demo-rows"
version = "1.0.0"
api_version = "0.1"
description = "Replaces the tool row for Bash, and nothing else."

[[ui]]
point = "tool.row"
module = "rows.js"
# The contribution API this module is written against — not the same number
# as `[plugin] api_version`, which is the engine's. A package can be current
# on one and stale on the other, so there are two and each side checks its
# own.
api_version = 1
